version: "3.9"

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 django"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  FASTAPI_BASE_URL: http://fastapi:8001
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
  CORS_ALLOWED_ORIGINS: "http://localhost,http://frontend"

x-fastapi-env: &fastapi-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
  MEDIA_ROOT: /app/media

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Django ────────────────────────────────────────────────────────────
  django:
    build:
      context: ./django_backend
      dockerfile: ../docker/Dockerfile.django
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --worker-class gthread
               --threads 2
               --timeout 60"

  # ── FastAPI ───────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./fastapi_service
      dockerfile: ../docker/Dockerfile.fastapi
    restart: unless-stopped
    environment:
      <<: *fastapi-env
    volumes:
      - media_data:/app/media:ro   # Read dataset files written by Django
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── React Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_DJANGO_URL: http://localhost/api/django
        VITE_FASTAPI_URL: http://localhost/api/analytics
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - django
      - fastapi
    networks:
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
