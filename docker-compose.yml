version: "3.9"

x-django-env: &django-env
  DJANGO_ENV: production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
  FASTAPI_SERVICE_SECRET: ${FASTAPI_SERVICE_SECRET}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 django frontend"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  FASTAPI_BASE_URL: http://fastapi:8001
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
  CORS_ALLOWED_ORIGINS: "http://localhost,http://frontend:80,http://nginx"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: http://localhost
  SERVICE_TOKEN_LIFETIME_SECONDS: "300"

x-fastapi-env: &fastapi-env
  JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
  FASTAPI_SERVICE_SECRET: ${FASTAPI_SERVICE_SECRET}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
  MEDIA_ROOT: /app/media
  REDIS_URL: redis://redis:6379/0

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── Django ────────────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.django
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --worker-class gthread
               --threads 2
               --timeout 60"

  # ── Celery Worker ────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.django
    restart: unless-stopped
    environment:
      <<: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - backend
    command: celery -A core worker --loglevel=info --concurrency=2

  # ── FastAPI ───────────────────────────────────────────────────
  fastapi:
    build:
      context: ./fastapi_service
      dockerfile: ../docker/Dockerfile.fastapi
    restart: unless-stopped
    environment:
      <<: *fastapi-env
    volumes:
      - media_data:/app/media:ro   # Read dataset files written by Django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Celery Beat (periodic tasks) ─────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.django
    restart: unless-stopped
    environment:
      <<: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── React Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_DJANGO_URL: /api/django
        VITE_FASTAPI_URL: /api/analytics
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_data:
  static_data:
  redis_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
