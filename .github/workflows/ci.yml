name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Django tests ──────────────────────────────────────────────────────
  django:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_SECRET_KEY: ci-test-fallback-secret-key-123
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      INTERNAL_SERVICE_KEY: ci-test-service-token-123
      FASTAPI_BASE_URL: http://localhost:8001


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: django_backend
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: django_backend
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: django_backend
        run: |
          coverage run manage.py test tests --verbosity=2
          coverage report --fail-under=70
          coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: django_backend/coverage.xml
          flags: django

  # ── FastAPI tests ─────────────────────────────────────────────────────
  fastapi:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi_service/requirements-dev.txt

      - name: Install dependencies
        working-directory: fastapi_service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: fastapi_service
        env:
          DJANGO_SECRET_KEY: ci-test-fallback-secret-key-123
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          INTERNAL_SERVICE_KEY: ci-test-service-token-123
        run: pytest -v --tb=short


  # ── Frontend build ────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_DJANGO_URL: http://localhost:8000
          VITE_FASTAPI_URL: http://localhost:8001
        run: npm run build

  # ── Docker Compose smoke test ─────────────────────────────────────────
  docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [django, fastapi, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/your-50-char-secret-key-here/ci-secret-key-that-is-long-enough-for-django-1234/' .env
          sed -i 's/your-internal-service-key-here/ci-internal-service-key/' .env
          sed -i 's/change_me_strong_password/cipassword123/' .env

      - name: Build and start services
        run: docker compose up -d --build postgres django fastapi

      - name: Wait for services
        run: |
          echo "Waiting for Django..."
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health 2>/dev/null || curl -sf http://localhost:8000/api/v1/ 2>/dev/null; do sleep 3; done' || true
          echo "Waiting for FastAPI..."
          timeout 60 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'

      - name: Smoke test FastAPI health
        run: curl -sf http://localhost:8001/health | grep '"status":"ok"'

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs
