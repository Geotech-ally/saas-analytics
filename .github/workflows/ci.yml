name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── Backend Tests ─────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SIGNING_SECRET: ci-test-jwt-secret-not-for-production
      FASTAPI_SERVICE_SECRET: ci-test-fastapi-secret-not-for-production
      INTERNAL_SERVICE_KEY: ci-test-service-token-123
      POSTGRES_DB: ci_test_db
      POSTGRES_USER: ci_test_user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      FASTAPI_BASE_URL: http://localhost:8001
      DJANGO_DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest -v --tb=short


  # ── Frontend Verification ─────────────────────────────────────
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_DJANGO_URL: /api/django
          VITE_FASTAPI_URL: /api/analytics
        run: npm run build

      # ✅ FRONTEND CORE FILE CHECK
      - name: Verify Core Frontend Files
        working-directory: frontend
        run: |
          echo "Checking frontend layout..."
          test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
          test -f src/main.tsx && echo "✓ src/main.tsx found" || (echo "✗ src/main.tsx missing" && exit 1)
          test -f src/App.tsx && echo "✓ src/App.tsx found" || (echo "✗ src/App.tsx missing" && exit 1)
          echo "All frontend assets verified!"


  # ── Docker Smoke Test ─────────────────────────────────────────
  docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create environment file
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
          JWT_SIGNING_SECRET=ci-test-jwt-secret-not-for-production
          FASTAPI_SERVICE_SECRET=ci-test-fastapi-secret-not-for-production
          INTERNAL_SERVICE_KEY=ci-test-service-token-123
          POSTGRES_DB=ci_test_db
          POSTGRES_USER=ci_test_user
          POSTGRES_PASSWORD=ci_test_password
          EOF

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check running containers
        run: docker ps