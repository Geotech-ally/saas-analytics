name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── Backend Tests ─────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      INTERNAL_SERVICE_KEY: ci-test-service-token-123
      FASTAPI_BASE_URL: http://localhost:8001

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest -v --tb=short


  # ── Frontend Verification ─────────────────────────────────────
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_DJANGO_URL: http://localhost:8000
          VITE_FASTAPI_URL: http://localhost:8001
        run: npm run build

      # ✅ ROOT STATIC CHECK (your fix requirement)
      - name: Verify Core Static Files (Root)
        run: |
          echo "Checking system layout at root..."
          test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
          test -f style.css && echo "✓ style.css found" || (echo "✗ style.css missing" && exit 1)
          test -f app.js && echo "✓ app.js found" || (echo "✗ app.js missing" && exit 1)
          echo "All static assets verified!"


  # ── Docker Smoke Test ─────────────────────────────────────────
  docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check running containers
        run: docker ps